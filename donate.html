<script>
function onVerify(){
  b1.disabled = b2.disabled = b3.disabled = false   // Turnstile прошёл, cf_clearance выдана
}

async function pay(method){
  const n = nick.value.trim()
  if(!n) return alert("Введите ник")
  const [id, price] = rank.value.split(" ")
  const res = await fetch("/api/pay", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      amount: +price,
      desc: id + " " + n,
      method
    })
  })
  const body = await res.text()
  console.log("api/pay:", res.status, body)          // временный лог для диагностики
  if(!res.ok || !/^https?:\/\//.test(body)) return alert("Ошибка оплаты. status=" + res.status)
  location = body
}
</script>
