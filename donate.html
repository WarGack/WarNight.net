<script>
let cleared = false
function onVerify(){ cleared = true }   // cf_clearance уже выставлена

async function pay(method){
  const n = nick.value.trim()
  if(!n) return alert("Введите ник")
  if(!cleared) return alert("Секунду, идёт проверка…")
  const [id, price] = rank.value.split(" ")
  const res = await fetch("/api/pay", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ amount: +price, desc: id + " " + n, method })
  })
  if(!res.ok) return alert("Ошибка, попробуйте позже")
  const url = await res.text()
  if(!/^https?:\/\//.test(url)) return alert("Ошибка оплаты")
  location = url
}
</script>
